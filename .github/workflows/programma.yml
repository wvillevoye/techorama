name: Programma ophalen
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  haal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node haal-programma.js
      - name: Opslaan als het programma gewijzigd is
        run: |
          git diff --quiet programma.json && exit 0
          git config user.name "programma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add programma.json
          git commit -m "Programma van techorama.nl bijgewerkt"
          git push
